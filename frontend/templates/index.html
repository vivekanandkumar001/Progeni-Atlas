<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<title>Swami AI — Interviewer Agent</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
  <h1>🧠 Swami AI <span>Interviewer Agent</span></h1>
</header>

<!-- SCREEN 1: Setup -->
<section id="screen-setup" class="screen active">
  <div class="card">
    <h2>Start Interview Setup</h2>
    <label>Upload Resume (PDF)</label>
    <input type="file" id="resumeFile" accept=".pdf,.txt">

    <label>Paste Job Description</label>
    <textarea id="jdText" rows="6" placeholder="Paste the JD here..."></textarea>

    <button id="btnGenerate">Generate Questions & Start</button>
    <p id="setupStatus" class="status"></p>
  </div>
</section>

<!-- SCREEN 2: Interview -->
<section id="screen-interview" class="screen">
  <div class="interview-grid">
    <div class="video-pane">
      <video id="webcamPreview" autoplay muted playsinline></video>
      <div id="recDot" class="rec-dot">● REC</div>
    </div>
    <div class="qa-pane">
      <div class="progress"><span id="progressText">Q1 / 8</span></div>
      <div class="question-box">
        <h3 id="questionType">technical</h3>
        <p id="questionText">Loading question…</p>
      </div>

      <div class="controls">
        <button id="btnRecord" class="btn-record">🎙️ Start Answer</button>
        <button id="btnStop" class="btn-stop" disabled>⏹ Stop & Submit</button>
      </div>

      <div id="answerFeedback" class="answer-feedback"></div>
    </div>
  </div>
</section>

<!-- SCREEN 3: Feedback Report -->
<section id="screen-report" class="screen">
  <div class="card report-card">
    <h2>📋 Interview Feedback Report</h2>
    <div id="reportBody">Generating report…</div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/interview.js') }}"></script>
</body>
</html>
